# Production-oriented stack. Secrets come from the environment / a secret manager, not from files in the image.
# Usage (from repo root): docker compose -f infrastructure/docker/compose.yaml --env-file .env up -d --build
name: github-code-intelligence-prod

x-backend: &backend
  build: ../../backend
  restart: unless-stopped
  env_file: ../../.env
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    EVALUATION_DATA_DIR: /evaluation_data
  volumes:
    - ../../evaluation_data:/evaluation_data:ro
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  backend:
    <<: *backend
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.queue"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ../../frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?}
    ports: ["8501:8501"]
    depends_on: [backend]

volumes:
  pgdata:
